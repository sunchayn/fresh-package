name: verify-template

on:
  pull_request:
  push:
    branches: [base]

jobs:
  sandbox-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Sandbox Matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: --no-scripts

      - name: Run template:sandbox --matrix
        run: php .template/init template:sandbox --matrix --parallel
