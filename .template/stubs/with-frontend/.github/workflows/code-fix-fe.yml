name: fix-fe-code-issues

on:
  push:
    branches: [base]
  pull_request:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup Environment
    outputs:
      is_fork: ${{ steps.compute_is_fork.outputs.is_fork }}
      fixable: ${{ steps.filter.outputs.fixable }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CI_TOKEN || github.token }}

      - id: compute_is_fork
        run: echo "is_fork=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            fixable:
              - '**.vue'
              - '**.ts'
              - 'package.json'

  style-fix-fe-internal:
    needs: setup
    if: needs.setup.outputs.is_fork == 'false' && needs.setup.outputs.fixable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Apply FE Code Fixes (Internal)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CI_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Fix js styles if Eslint passes
        run: npm run style:fix

      - name: Commit JS changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply TS style fixes"

      - name: Fail if fixes could not be auto-applied
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Code fixers produced changes, but it was not possible to auto-commit them."
            echo "Please apply the code fixes locally and push them to the PR branch."
            exit 1
          fi

  style-check-fe-fork:
    needs: setup
    if: needs.setup.outputs.is_fork == 'true' && needs.setup.outputs.fixable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check FE Code Styles (Fork)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check js styles
        run: npm run style:check

  status:
    needs: [style-fix-fe-internal, style-check-fe-fork]
    if: always()
    runs-on: ubuntu-latest
    name: FE Code Fix Status
    steps:
      - name: Check overall status
        run: |
          if [[ "${{ needs.style-fix-fe-internal.result }}" == "failure" || "${{ needs.style-check-fe-fork.result }}" == "failure" ]]; then
            echo "One of the style jobs failed."
            exit 1
          fi
          echo "All required style jobs passed or were skipped."
          exit 0
